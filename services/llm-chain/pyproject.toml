[project]
name = "llm-chain-service"
version = "0.1.0"
description = "LangChain-based AI analysis service for Polymarket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-contracts @ git+https://github.com/eslam-aboutaleb/prompt-contracts.git@15b8737f3d7e329612fb85a1d440994015a2573e",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "duckduckgo-search>=4.0.0",
    "ddgs>=0.1.0",
    # Default provider - OpenAI
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    # Premium search providers
    "tavily-python>=0.3.0",
    # News API
    "newsapi-python>=0.2.7",
    # Keep a compatible SDK range that accepts patched filelock releases.
    # Later LiteLLM releases currently cap filelock below the security fixes.
    "langchain-litellm>=0.8,<0.9",
    "litellm>=1.103.9,<1.104",
    "filelock>=4.2.1,<5",
    "llm-gateway-sdk[settings] @ git+https://github.com/eslam-aboutaleb/llm-gateway-sdk.git@v0.1.0",
]

[project.optional-dependencies]
# Additional LLM providers (install as needed)
anthropic = ["langchain-anthropic>=0.1.0", "anthropic>=0.18.0"]
google = ["langchain-google-genai>=1.0.0", "google-generativeai>=0.3.0"]
groq = ["langchain-groq>=0.1.0"]
all-providers = [
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.18.0",
    "langchain-google-genai>=1.0.0",
    "google-generativeai>=0.3.0",
    "langchain-groq>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.6.9",
]

[tool.uv]
require-build-hashes = true
build-constraint-dependencies = [
    { requirement = "editables==0.5", hashes = ["sha256:61e5ffa82629e0d8bfe09bc44a07db3c1ab8ed1ce78a6980732870f19b5e7d4c"] },
    { requirement = "hatchling==1.26.3", hashes = ["sha256:c407e1c6c17b574584a66ae60e8e9a01235ecb6dc61d01559bb936577aaf5846"] },
    { requirement = "packaging==26.3", hashes = ["sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"] },
    { requirement = "pathspec==1.1.1", hashes = ["sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"] },
    { requirement = "pluggy==1.7.0", hashes = ["sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec"] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = ["sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17"] },
]
