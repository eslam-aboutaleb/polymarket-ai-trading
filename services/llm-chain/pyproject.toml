[project]
name = "llm-chain-service"
version = "0.1.0"
description = "LangChain-based AI analysis service for Polymarket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "duckduckgo-search>=4.0.0",
    "ddgs>=0.1.0",
    # Default provider - OpenAI
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    # RAG / Vector DB
    "chromadb>=0.4.0",
    "langchain-chroma>=0.1.0",
    # Premium search providers
    "tavily-python>=0.3.0",
    # News API
    "newsapi-python>=0.2.7",
]

[project.optional-dependencies]
# Additional LLM providers (install as needed)
anthropic = ["langchain-anthropic>=0.1.0", "anthropic>=0.18.0"]
google = ["langchain-google-genai>=1.0.0", "google-generativeai>=0.3.0"]
groq = ["langchain-groq>=0.1.0"]
all-providers = [
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.18.0",
    "langchain-google-genai>=1.0.0",
    "google-generativeai>=0.3.0",
    "langchain-groq>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
