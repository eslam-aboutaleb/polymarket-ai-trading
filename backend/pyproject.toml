[project]
name = "polymarket-api"
version = "0.1.0"
description = "Polymarket AI Trading Automation Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "PyJWT>=2.15.1,<3",
    "cryptography>=50.0.0",
    "py-clob-client>=0.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "langchain>=0.1.0",
    "langchain-openai>=1.1.14",
    "langchain-community>=0.0.20",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.2.2",
    "alembic>=1.12.0",
    "eth-keys>=0.5.0",
    "eth-utils>=2.0.0",
    "eth-account>=0.10.0",
    "web3>=7.15.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "py-clob-client-v2==1.2.1",
    "llm-gateway-sdk[settings] @ git+https://github.com/eslam-aboutaleb/llm-gateway-sdk.git@v0.1.0",
]

[dependency-groups]
# Test and lint tooling, installed by `uv sync --group dev` and
# invoked through `uv run --frozen pytest` / `uv run --frozen ruff`
# (see .pre-commit-config.yaml). Declaring them here keeps the
# lockfile the single source of truth for the pinned versions.
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0",
    "pytest-randomly>=5.0",
    "ruff>=0.6.9",
]

[tool.ruff]
# Inherit the single repository-wide Ruff configuration so lint results are
# identical whether Ruff is invoked from the repo root or from backend/.
extend = "../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ensures the `app` package resolves when running pytest from backend/,
# and that the shared `polymarket_settings` package (mounted from
# ../services/shared) is importable.
pythonpath = [".", "../services/shared"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml:coverage.xml"

# Randomize test order (pytest-randomly). Module-level counters and cached
# singletons made several tests pass only in file order; randomizing turned
# those latent bugs into deterministic failures, and the shared reset fixture
# in tests/conftest.py fixes them. Pass `-p no:randomly` or
# `--randomly-seed=<n>` to reproduce a specific ordering.
[tool.pytest.ini_options.pytest_randomly]
# No fixed seed: every run exercises a different order. A failing run prints
# the seed it used, which is the fastest way to reproduce it.

[tool.coverage.run]
# Migrations and gRPC stubs are infrastructure, not business logic.
omit = [
    "*/migrations/*",
    "*/app/grpc_clients/*_pb2*.py",
]
# Services are exercised through mocked I/O; branch coverage is what matters.

[tool.coverage.report]
show_missing = true
skip_covered = false
# Fail the run if total coverage regresses below the agreed floor.
fail_under = 0
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.uv]
require-build-hashes = true
build-constraint-dependencies = [
    { requirement = "editables==0.5", hashes = ["sha256:61e5ffa82629e0d8bfe09bc44a07db3c1ab8ed1ce78a6980732870f19b5e7d4c"] },
    { requirement = "hatchling==1.26.3", hashes = ["sha256:c407e1c6c17b574584a66ae60e8e9a01235ecb6dc61d01559bb936577aaf5846"] },
    { requirement = "packaging==26.3", hashes = ["sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"] },
    { requirement = "pathspec==1.1.1", hashes = ["sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"] },
    { requirement = "pluggy==1.7.0", hashes = ["sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec"] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = ["sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17"] },
]
