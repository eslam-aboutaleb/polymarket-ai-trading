name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: uv sync --project backend --frozen
      - name: Ruff check
        run: uv run --project backend --frozen ruff check --config ruff.toml backend services
      - name: Ruff format
        run: uv run --project backend --frozen ruff format --check --config ruff.toml backend services
      - name: Duplication check (jscpd, < 3%)
        run: ./scripts/check-duplication.sh

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen
      - name: "Pytest with coverage (Sonar gate: >= 80%)"
        run: uv run pytest --cov --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css,json,html}"
