name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      walletconnect_live_canary:
        description: "Verify real Reown project and QR initialization (requires repository secret)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: uv sync --project backend --frozen
      - name: Ruff check
        run: uv run --project backend --frozen ruff check --config ruff.toml backend services
      - name: Ruff format
        run: uv run --project backend --frozen ruff format --check --config ruff.toml backend services
      - name: Backend/service protocol compatibility
        run: uv run --project backend --frozen pytest --no-cov services/tests
      - name: Duplication check (jscpd, < 3%)
        run: ./scripts/check-duplication.sh

  # Shared workflows are reviewed and pinned as one immutable revision.
  # Update all pins together after reviewing ci-workflows changes.
  backend-tests:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/python.yml@46c9653ee6c35c498c56e297dfb0a1a06a7c1958
    with:
      project-dir: backend
      manager: uv
      python-versions: '["3.11"]'
      coverage-source: app
      coverage-min: 80

  trading-safety:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/integration.yml@46c9653ee6c35c498c56e297dfb0a1a06a7c1958
    with:
      project-dir: backend
      python-version: "3.11"

  emergency-browser:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/browser.yml@46c9653ee6c35c498c56e297dfb0a1a06a7c1958
    with:
      project-dir: frontend
      manager: npm
      node-version: "20"
      test-script: test:safety
      browsers: chromium

  # Full real-stack Playwright regression suite. The emergency-browser reusable
  # workflow only runs test:safety; it does not cover auth/features/public E2E.
  e2e:
    name: E2E / Playwright full stack
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: polymarket_e2e_only
          POSTGRES_DB: polymarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polymarket -d polymarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://polymarket:polymarket_e2e_only@127.0.0.1:5432/polymarket
      ENVIRONMENT: development
      ROLE: web
      REDIS_URL: ""
      REQUIRE_REDIS_FOR_CREDENTIALS: "false"
      REQUIRE_REDIS_FOR_CHALLENGES: "false"
      RATE_LIMIT_PER_MINUTE: "1000"
      ADMIN_WALLETS: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
      VITE_API_URL: ""
      # Deliberately fake identifier: never expose repository secrets to PR E2E.
      VITE_WALLETCONNECT_PROJECT_ID: "ci-walletconnect-project-id"
      E2E_BASE_URL: http://localhost:5174
      CORS_ALLOWED_ORIGINS: "http://localhost:5174,http://localhost:5173,http://localhost:3000"
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/e2e-junit.xml
      # Do not enable live Polymarket orders or expose any real wallet key.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate isolated signing secret
        shell: bash
        run: |
          printf 'JWT_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install backend dependencies
        run: uv sync --project backend --frozen
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: WalletConnect browser regressions (controlled SDK boundary)
        working-directory: frontend
        run: npm run test:walletconnect
      - name: Live WalletConnect QR canary
        if: github.event_name == 'workflow_dispatch' && inputs.walletconnect_live_canary
        working-directory: frontend
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          WALLETCONNECT_LIVE_CANARY: "1"
        run: npm run test:walletconnect
      - name: Run PostgreSQL schema migrations
        working-directory: backend
        run: uv run --frozen alembic upgrade head
      - name: Native capture PostgreSQL concurrency
        working-directory: backend
        env:
          PYTHONPATH: .:../services/shared
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run --frozen pytest --no-cov tests/integration/test_native_capture_postgres.py
      - name: Seed disposable admin test wallet
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/services/shared
        run: |
          uv run --project backend --frozen python - <<'PY'
          from app.models.users.user import User
          from app.utils.database import SessionLocal

          wallet = "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          with SessionLocal.begin() as db:
              user = db.query(User).filter(User.wallet_address == wallet).one_or_none()
              if user is None:
                  db.add(User(wallet_address=wallet, is_admin=True))
              else:
                  user.is_admin = True
          print("Disposable CI admin wallet seeded")
          PY
      - name: Research E2E (real API and controlled provider boundaries)
        working-directory: frontend
        run: npm run test:research
      - name: Run full Playwright E2E (public, auth, features)
        working-directory: frontend
        run: npm run test:e2e -- --project=public --project=auth --project=features --reporter=list,junit
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  workflow-lint:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/workflow-lint.yml@46c9653ee6c35c498c56e297dfb0a1a06a7c1958

  security:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/security.yml@46c9653ee6c35c498c56e297dfb0a1a06a7c1958
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    with:
      languages: '["python", "javascript-typescript", "actions"]'
      dependency-severity: high

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        # Non-blocking: 27 high-severity transitive advisories (ws via
        # ethers/viem/@solana, pulled in by the wallet deps) are unfixed.
        # Tracked in .kilo/plans/context-shared.md; flip to blocking once
        # the transitive fixes land without breaking package.json.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Type-check and build
        env:
          # Vite embeds this public identifier into its browser bundle at build time.
          # Secrets may be unavailable on forked PRs; the build still validates.
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: npm run build
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css,json,html}"

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      [
        lint,
        backend-tests,
        trading-safety,
        frontend,
        emergency-browser,
        e2e,
        workflow-lint,
        security,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["CHECK_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required checks did not succeed: {failed}")
          print("All required checks passed")
          PY
