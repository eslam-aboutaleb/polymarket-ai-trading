name: Real user experience (manual)

# GitHub's Run workflow menu selects the branch to check out and test.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-ux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-user-experience:
    name: Real user workflows / live providers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: real_ux_test_only
          POSTGRES_DB: polymarket_real_ux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polymarket -d polymarket_real_ux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked API and LLM service dependencies
        run: |
          uv sync --project backend --frozen --python 3.11
          uv sync --project services/llm-chain --frozen --python 3.11
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise real authenticated AI and research workflows
        env:
          UX_TEST_DATABASE_URL: postgresql://polymarket:real_ux_test_only@127.0.0.1:5432/polymarket_real_ux
          OPENAI_API_KEY: ${{ secrets.REAL_UX_OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.REAL_UX_TAVILY_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.REAL_UX_NEWSAPI_API_KEY }}
        run: uv run --project backend --frozen python scripts/run-real-ux.py
      - name: Upload redacted failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-user-workflows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/real-ux-artifacts/
          if-no-files-found: warn
          retention-days: 3
