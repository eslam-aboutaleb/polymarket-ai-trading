# SonarQube project configuration.
#
# Run with:  sonar-scanner -Dsonar.projectKey=polymarket
#
# The quality gate this file targets:
#   - Duplicated lines (CPD)      < 3%
#   - Line coverage                >= 80%
#   - No new issues on new code    (default Sonar "Clean as You Code" gate)
#   - No open CRITICAL or BLOCKER issues
#
# Lint and duplication are additionally enforced locally and in pre-commit, so a
# regression can be caught without a SonarQube server:
#   uv run --project backend --frozen ruff check --config ruff.toml backend services
#   npx jscpd --min-lines 5 --min-tokens 50 backend/app services frontend/src

sonar.projectKey=polymarket
sonar.projectName=Polymarket AI Trading Automation
sonar.organization=polymarket

# ── Sources ───────────────────────────────────────────────────────────────
sonar.sources=backend/app,backend/main.py,backend/tests,services,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.sourceEncoding=UTF-8

# ── Exclusions ───────────────────────────────────────────────────────────
# Generated protobuf stubs and Alembic revisions are not hand-maintained and
# would otherwise dominate the issue list.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/*.pb2.py,\
  **/*_pb2_grpc.py,\
  **/*.min.js,\
  **/docs/****

# Tests are analysed but not counted as production code.
sonar.coverage.exclusions=\
  **/tests/**,\
  **/node_modules/**,\
  **/migrations/**,\
  **/config.py

# Python: coverage is produced by pytest-cov (see backend/pyproject.toml).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.11

# JavaScript/TypeScript: coverage is produced by the frontend test runner.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Duplication (CPD) ────────────────────────────────────────────────────
# SonarQube's CPD token count is language-specific; 5 tokens / 10 lines is the
# usual starting point for Python and TypeScript.
sonar.cpd.exclusions=\
  **/*.pb2.py,\
  **/*_pb2_grpc.py,\
  **/migrations/**,\
  **/node_modules/**

# ── Analysis scope ───────────────────────────────────────────────────────
sonar.python.pylint=true
sonar.python.flake8=false
sonar.typescript.tsconfigPath=frontend/tsconfig.json
