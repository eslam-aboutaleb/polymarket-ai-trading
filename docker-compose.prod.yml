# ── Production Docker Compose ──────────────────────────────────
# Usage:
#   cp .env.prod.example .env.prod     # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ───────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-polymarket}
    # No host port binding — only reachable inside the compose network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-polymarket_user} -d ${POSTGRES_DB:-polymarket}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── LLM Chain (gRPC AI service) ──────────────────────────────
  llm-chain:
    build:
      context: .
      dockerfile: services/llm-chain/Dockerfile.prod
    expose:
      - "50051"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      # Per-task model tiering (see polymarket_settings)
      LLM_TIERING_ENABLED: ${LLM_TIERING_ENABLED:-true}
      LLM_STRONG_REASONING_EFFORT: ${LLM_STRONG_REASONING_EFFORT:-medium}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GRPC_PORT: 50051
      PROMPTS_PATH: /app/prompts/prompts.json
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_ENABLED: ${TAVILY_ENABLED:-false}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      NEWSAPI_ENABLED: ${NEWSAPI_ENABLED:-false}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      CHROMA_PERSIST_DIR: /app/data/chroma
      # Research MCP: Binance Skills enrichment is gated by this env var in
      # the shared client, so it also covers cli-agent.
      BINANCE_SKILLS_ENABLED: ${BINANCE_SKILLS_ENABLED:-true}
    volumes:
      - ./prompts:/app/prompts:ro
      - llm_chain_chroma:/app/data/chroma
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── CLI Agent (gRPC AI service) ──────────────────────────────
  cli-agent:
    build:
      context: .
      dockerfile: services/cli-agent/Dockerfile.prod
    expose:
      - "50052"
    environment:
      GRPC_PORT: 50052
      PROMPTS_PATH: /app/prompts/prompts.json
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MODEL: ${GITHUB_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Research MCP: Binance Skills enrichment gate (shared with llm-chain)
      BINANCE_SKILLS_ENABLED: ${BINANCE_SKILLS_ENABLED:-true}
    volumes:
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    expose:
      - "8002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      REFRESH_TOKEN_HASH_SECRET: ${REFRESH_TOKEN_HASH_SECRET:-}
      ENCRYPTION_MASTER_KEYS: ${ENCRYPTION_MASTER_KEYS:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      CREDENTIAL_CACHE_TTL_SECONDS: ${CREDENTIAL_CACHE_TTL_SECONDS:-3600}
      REQUIRE_REDIS_FOR_CREDENTIALS: "true"
      ENVIRONMENT: production
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-true}
      LIVE_COPY_TRADING_ENABLED: ${LIVE_COPY_TRADING_ENABLED:-true}
      LIVE_MARKET_MAKING_ENABLED: ${LIVE_MARKET_MAKING_ENABLED:-true}
      LIVE_LATENCY_ARB_ENABLED: ${LIVE_LATENCY_ARB_ENABLED:-true}
      LATENCY_ARB_LIVE: ${LATENCY_ARB_LIVE:-true}
      LIVE_INVERSE_TRADING_ENABLED: ${LIVE_INVERSE_TRADING_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://yourdomain.com}
      DEBUG_ENDPOINTS_ENABLED: "false"
      DEBUG_LOG_HASH_SALT: ${DEBUG_LOG_HASH_SALT:-}
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PROMPTS_PATH: /app/prompts/prompts.json
      # Shared polymarket_settings package (read-only mount; the
      # ./backend build context cannot COPY services/shared).
      PYTHONPATH: /app:/app/shared
      LLM_CHAIN_GRPC_HOST: llm-chain
      LLM_CHAIN_GRPC_PORT: 50051
      CLI_AGENT_GRPC_HOST: cli-agent
      CLI_AGENT_GRPC_PORT: 50052
      DEFAULT_AI_BACKEND: ${DEFAULT_AI_BACKEND:-llm_chain}
      GRPC_TIMEOUT: ${GRPC_TIMEOUT:-60}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
      # Process role (plan 10 Phase A): "web" means this container
      # serves HTTP and owns NO background scheduler. Every scheduler
      # takes a Postgres advisory lock, so scaling WEB_CONCURRENCY
      # only multiplies request capacity — never stop-loss orders.
      # The `backend-worker` service below owns the schedulers.
      ROLE: "web"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-chain:
        condition: service_started
      cli-agent:
        condition: service_started
    volumes:
      - ./prompts:/app/prompts:ro
      - ./services/shared:/app/shared:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Backend worker (background schedulers only) ─────────────
  # Runs every monitor: trade monitor, stop-loss, inverse bot, market
  # maker, position lifecycle, aggregation, arbitrage, news digest,
  # whale/CTF events, redemption, latency arb, equity snapshots,
  # forecast resolution and the event-log writer.
  #
  # Exactly one instance. Each scheduler already takes a Postgres
  # advisory lock, so a second worker would skip them all anyway —
  # but a stopped worker means no stop-loss at all, which is why
  # `restart: unless-stopped` and the dead-man's-switch watchdog
  # (in-app) matter more here than anywhere else in this file.
  backend-worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      REFRESH_TOKEN_HASH_SECRET: ${REFRESH_TOKEN_HASH_SECRET:-}
      ENCRYPTION_MASTER_KEYS: ${ENCRYPTION_MASTER_KEYS:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      CREDENTIAL_CACHE_TTL_SECONDS: ${CREDENTIAL_CACHE_TTL_SECONDS:-3600}
      REQUIRE_REDIS_FOR_CREDENTIALS: "true"
      ENVIRONMENT: production
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-true}
      LIVE_COPY_TRADING_ENABLED: ${LIVE_COPY_TRADING_ENABLED:-true}
      LIVE_MARKET_MAKING_ENABLED: ${LIVE_MARKET_MAKING_ENABLED:-true}
      LIVE_LATENCY_ARB_ENABLED: ${LIVE_LATENCY_ARB_ENABLED:-true}
      LATENCY_ARB_LIVE: ${LATENCY_ARB_LIVE:-true}
      LIVE_INVERSE_TRADING_ENABLED: ${LIVE_INVERSE_TRADING_ENABLED:-true}
      DEBUG_ENDPOINTS_ENABLED: "false"
      DEBUG_LOG_HASH_SALT: ${DEBUG_LOG_HASH_SALT:-}
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PROMPTS_PATH: /app/prompts/prompts.json
      PYTHONPATH: /app:/app/shared
      LLM_CHAIN_GRPC_HOST: llm-chain
      LLM_CHAIN_GRPC_PORT: 50051
      CLI_AGENT_GRPC_HOST: cli-agent
      CLI_AGENT_GRPC_PORT: 50052
      DEFAULT_AI_BACKEND: ${DEFAULT_AI_BACKEND:-llm_chain}
      GRPC_TIMEOUT: ${GRPC_TIMEOUT:-60}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
      BINANCE_SKILLS_ENABLED: ${BINANCE_SKILLS_ENABLED:-true}
      # "worker" starts the schedulers and serves no HTTP.
      ROLE: "worker"
    # Boot the schedulers without an ASGI server (plan 10 Phase A).
    command: ["uv", "run", "python", "-m", "app.worker_main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The backend runs `alembic upgrade head` before uvicorn, so the
      # worker's schedulers start only after the schema has been migrated.
      backend:
        condition: service_started
      llm-chain:
        condition: service_started
      cli-agent:
        condition: service_started
    volumes:
      - ./prompts:/app/prompts:ro
      - ./services/shared:/app/shared:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Frontend (nginx serving Vite build) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: "" # empty → relative /api, proxied by nginx
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  llm_chain_chroma:
