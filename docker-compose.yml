services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: polymarket_user
      POSTGRES_PASSWORD: polymarket_password
      POSTGRES_DB: polymarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket_user -d polymarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dev_redis_password} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LLM Chain Service - LangChain backend (supports multiple LLM providers)
  llm-chain:
    build:
      context: .
      dockerfile: services/llm-chain/Dockerfile
    ports:
      - "50051:50051"
    environment:
      # LLM Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo-preview}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      # Provider API Keys (only the selected provider's key is used)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Service config
      GRPC_PORT: 50051
      PROMPTS_PATH: /app/prompts/prompts.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Research providers (optional — graceful fallback to DuckDuckGo)
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_ENABLED: ${TAVILY_ENABLED:-false}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      NEWSAPI_ENABLED: ${NEWSAPI_ENABLED:-false}
      # ChromaDB RAG (vector search for market discovery)
      RAG_ENABLED: ${RAG_ENABLED:-true}
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - ./prompts:/app/prompts:ro
      - llm_chain_chroma:/app/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CLI Agent Service - GitHub Copilot CLI backend
  cli-agent:
    build:
      context: .
      dockerfile: services/cli-agent/Dockerfile
    ports:
      - "50052:50052"
    environment:
      GRPC_PORT: 50052
      PROMPTS_PATH: /app/prompts/prompts.json
      MCP_CONFIG_PATH: /app/mcp-config.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # GitHub Models API (uses GITHUB_TOKEN for auth)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MODEL: ${GITHUB_MODEL:-gpt-4o-mini}
      # Fallback: OpenAI API (if no GITHUB_TOKEN)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # MCP tool API keys
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY:-}
      POLYMARKET_CHAIN_ID: ${POLYMARKET_CHAIN_ID:-137}
    volumes:
      - ./prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://polymarket_user:polymarket_password@postgres:5432/polymarket
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0
      # SECURITY: JWT_SECRET_KEY must be set via .env file or environment
      # Generate with: openssl rand -hex 32
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      REFRESH_TOKEN_HASH_SECRET: ${REFRESH_TOKEN_HASH_SECRET:-}
      # Credential encryption keys (comma-separated Fernet keys preferred)
      ENCRYPTION_MASTER_KEYS: ${ENCRYPTION_MASTER_KEYS:-}
      # Backward-compatible fallback (single key)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      CREDENTIAL_CACHE_TTL_SECONDS: ${CREDENTIAL_CACHE_TTL_SECONDS:-3600}
      REQUIRE_REDIS_FOR_CREDENTIALS: ${REQUIRE_REDIS_FOR_CREDENTIALS:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DEBUG_ENDPOINTS_ENABLED: ${DEBUG_ENDPOINTS_ENABLED:-false}
      DEBUG_LOG_HASH_SALT: ${DEBUG_LOG_HASH_SALT:-}
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PROMPTS_PATH: /app/prompts/prompts.json
      # AI Service gRPC configuration
      LLM_CHAIN_GRPC_HOST: llm-chain
      LLM_CHAIN_GRPC_PORT: 50051
      CLI_AGENT_GRPC_HOST: cli-agent
      CLI_AGENT_GRPC_PORT: 50052
      DEFAULT_AI_BACKEND: ${DEFAULT_AI_BACKEND:-llm_chain}
      GRPC_TIMEOUT: ${GRPC_TIMEOUT:-60}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-chain:
        condition: service_started
      cli-agent:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./prompts:/app/prompts:ro
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run python3 -m grpc_tools.protoc -Iproto --python_out=app/grpc_clients --grpc_python_out=app/grpc_clients proto/analysis.proto &&
             sed -i 's/^import analysis_pb2/from app.grpc_clients import analysis_pb2/' app/grpc_clients/analysis_pb2_grpc.py &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "if ! cmp -s package-lock.json node_modules/.package-lock.source 2>/dev/null; then
               npm ci &&
               cp package-lock.json node_modules/.package-lock.source;
             fi &&
             npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  redis_data:
  llm_chain_chroma:
