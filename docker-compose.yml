services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: polymarket_user
      POSTGRES_PASSWORD: polymarket_password
      POSTGRES_DB: polymarket
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket_user -d polymarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:-dev_redis_password} redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LLM Chain Service - LangChain backend (supports multiple LLM providers)
  llm-chain:
    build:
      context: .
      dockerfile: services/llm-chain/Dockerfile
    ports:
      - "50061:50051"
    environment:
      # LLM Configuration
      LITELLM_API_BASE: ${LITELLM_API_BASE:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-}
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL:-}
      LITELLM_EMBEDDING_API_KEY: ${LITELLM_EMBEDDING_API_KEY:-}
      LITELLM_EMBEDDING_API_BASE: ${LITELLM_EMBEDDING_API_BASE:-}
      LITELLM_EMBEDDING_DIMENSIONS: ${LITELLM_EMBEDDING_DIMENSIONS:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      # Per-task model tiering (see polymarket_settings)
      LLM_TIERING_ENABLED: ${LLM_TIERING_ENABLED:-true}
      LLM_TIER_CHEAP_MODEL: ${LLM_TIER_CHEAP_MODEL:-}
      LLM_TIER_STANDARD_MODEL: ${LLM_TIER_STANDARD_MODEL:-}
      LLM_TIER_STRONG_MODEL: ${LLM_TIER_STRONG_MODEL:-}
      LLM_TIER_WRITER_MODEL: ${LLM_TIER_WRITER_MODEL:-}
      LLM_STRONG_REASONING_EFFORT: ${LLM_STRONG_REASONING_EFFORT:-medium}
      # Provider API Keys (only the selected provider's key is used)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Service config
      GRPC_PORT: 50051
      PROMPTS_PATH: /app/prompts/prompts.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Research providers (optional — graceful fallback to DuckDuckGo)
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_ENABLED: ${TAVILY_ENABLED:-false}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      NEWSAPI_ENABLED: ${NEWSAPI_ENABLED:-false}
      # SQLite RAG (vector search for market discovery)
      RAG_ENABLED: ${RAG_ENABLED:-true}
      CHROMA_PERSIST_DIR: /app/data/chroma
      # Research MCP: Binance Skills enrichment is gated by this env var in
      # the shared client, so it also covers cli-agent.
      BINANCE_SKILLS_ENABLED: ${BINANCE_SKILLS_ENABLED:-true}
    volumes:
      - ./prompts:/app/prompts:ro
      - llm_chain_chroma:/app/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CLI Agent Service - LiteLLM gateway backend
  cli-agent:
    build:
      context: .
      dockerfile: services/cli-agent/Dockerfile
    ports:
      - "50052:50052"
    environment:
      LITELLM_API_BASE: ${LITELLM_API_BASE:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-}
      LLM_PROVIDER: litellm
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TIERING_ENABLED: ${LLM_TIERING_ENABLED:-true}
      LLM_TIER_CHEAP_MODEL: ${LLM_TIER_CHEAP_MODEL:-}
      LLM_TIER_STANDARD_MODEL: ${LLM_TIER_STANDARD_MODEL:-}
      LLM_TIER_STRONG_MODEL: ${LLM_TIER_STRONG_MODEL:-}
      LLM_TIER_WRITER_MODEL: ${LLM_TIER_WRITER_MODEL:-}
      GRPC_PORT: 50052
      PROMPTS_PATH: /app/prompts/prompts.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MODEL: ${GITHUB_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Research MCP: Binance Skills enrichment gate (shared with llm-chain)
      BINANCE_SKILLS_ENABLED: ${BINANCE_SKILLS_ENABLED:-true}
    volumes:
      - ./prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://polymarket_user:polymarket_password@postgres:5432/polymarket
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0
      # SECURITY: JWT_SECRET_KEY must be set via .env file or environment
      # Generate with: openssl rand -hex 32
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      REFRESH_TOKEN_HASH_SECRET: ${REFRESH_TOKEN_HASH_SECRET:-}
      # Credential encryption keys (comma-separated Fernet keys preferred)
      ENCRYPTION_MASTER_KEYS: ${ENCRYPTION_MASTER_KEYS:-}
      # Backward-compatible fallback (single key)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      CREDENTIAL_CACHE_TTL_SECONDS: ${CREDENTIAL_CACHE_TTL_SECONDS:-3600}
      REQUIRE_REDIS_FOR_CREDENTIALS: ${REQUIRE_REDIS_FOR_CREDENTIALS:-true}
      REQUIRE_REDIS_FOR_CHALLENGES: ${REQUIRE_REDIS_FOR_CHALLENGES:-true}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ROLE: ${ROLE:-all}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-true}
      LIVE_COPY_TRADING_ENABLED: ${LIVE_COPY_TRADING_ENABLED:-true}
      LIVE_MARKET_MAKING_ENABLED: ${LIVE_MARKET_MAKING_ENABLED:-true}
      LIVE_LATENCY_ARB_ENABLED: ${LIVE_LATENCY_ARB_ENABLED:-true}
      LATENCY_ARB_LIVE: ${LATENCY_ARB_LIVE:-true}
      LATENCY_ARB_LATE_ENTRY: ${LATENCY_ARB_LATE_ENTRY:-true}
      LIVE_INVERSE_TRADING_ENABLED: ${LIVE_INVERSE_TRADING_ENABLED:-true}
      ACCOUNTS_ENABLED: ${ACCOUNTS_ENABLED:-true}
      VENUE_KALSHI_ENABLED: ${VENUE_KALSHI_ENABLED:-true}
      VENUE_MANIFOLD_ENABLED: ${VENUE_MANIFOLD_ENABLED:-true}
      VENUE_PREDICTIT_ENABLED: ${VENUE_PREDICTIT_ENABLED:-true}
      PAPER_JOURNAL_V2_ENABLED: ${PAPER_JOURNAL_V2_ENABLED:-true}
      PAPER_MAKER_FILL_MODEL_V2: ${PAPER_MAKER_FILL_MODEL_V2:-true}
      NATIVE_CAPTURE_ENABLED: ${NATIVE_CAPTURE_ENABLED:-true}
      OBSERVATION_ARCHIVE_ENABLED: ${OBSERVATION_ARCHIVE_ENABLED:-true}
      BINARY_BOOK_RESEARCH_ENABLED: ${BINARY_BOOK_RESEARCH_ENABLED:-true}
      EXECUTABLE_REPLAY_ENABLED: ${EXECUTABLE_REPLAY_ENABLED:-true}
      FOLLOWER_REPLAY_ENABLED: ${FOLLOWER_REPLAY_ENABLED:-true}
      PRICE_ALERT_LLM_ENABLED: ${PRICE_ALERT_LLM_ENABLED:-true}
      DAILY_DIGEST_ENABLED_DEFAULT: ${DAILY_DIGEST_ENABLED_DEFAULT:-true}
      BINANCE_SKILLS_ENABLED: ${BINANCE_SKILLS_ENABLED:-true}
      RESEARCH_MCP_BATCH_ENABLED: ${RESEARCH_MCP_BATCH_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:5174}
      DEBUG_ENDPOINTS_ENABLED: ${DEBUG_ENDPOINTS_ENABLED:-true}
      DEBUG_LOG_HASH_SALT: ${DEBUG_LOG_HASH_SALT:-}
      WS_ALLOW_QUERY_KEY: ${WS_ALLOW_QUERY_KEY:-true}
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PROMPTS_PATH: /app/prompts/prompts.json
      # Shared polymarket_settings package (read-only mount; the
      # ./backend build context cannot COPY services/shared).
      PYTHONPATH: /app:/app/shared
      # AI Service gRPC configuration
      LLM_CHAIN_GRPC_HOST: llm-chain
      LLM_CHAIN_GRPC_PORT: 50051
      CLI_AGENT_GRPC_HOST: cli-agent
      CLI_AGENT_GRPC_PORT: 50052
      DEFAULT_AI_BACKEND: ${DEFAULT_AI_BACKEND:-llm_chain}
      GRPC_TIMEOUT: ${GRPC_TIMEOUT:-60}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-chain:
        condition: service_started
      cli-agent:
        condition: service_started
    volumes:
      - ./backend:/app
      # Isolate Linux container dependencies from the host Python environment.
      - backend_venv:/app/.venv
      - ./prompts:/app/prompts:ro
      - ./services/shared:/app/shared:ro
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run python3 -m grpc_tools.protoc -Iproto --python_out=app/grpc_clients --grpc_python_out=app/grpc_clients proto/analysis.proto &&
             sed -i 's/^import analysis_pb2/from app.grpc_clients import analysis_pb2/' app/grpc_clients/analysis_pb2_grpc.py &&
              uv run uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload --reload-dir /app/app --reload-dir /app/shared"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "if ! cmp -s package-lock.json node_modules/.package-lock.source 2>/dev/null; then
               npm ci &&
               cp package-lock.json node_modules/.package-lock.source;
             fi &&
             npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8002
      VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-6138cf3a90efc995c6dab7853a83a4e2}

volumes:
  postgres_data:
  redis_data:
  llm_chain_chroma:
  backend_venv:
