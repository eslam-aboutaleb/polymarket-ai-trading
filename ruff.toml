# Canonical Ruff configuration for every Python package in this repository.
#
# backend/pyproject.toml inherits this via `[tool.ruff] extend = "../../ruff.toml"`,
# so `ruff check` behaves identically whether it is invoked from the repo root or
# from inside backend/.
#
# Run with:  uv run --frozen ruff --config ruff.toml check .

line-length = 100
target-version = "py311"

extend-exclude = [
    ".venv",
    "backend/migrations",
    # gRPC stubs generated by grpc_tools.protoc.
    "**/analysis_pb2.py",
    "**/analysis_pb2_grpc.py",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
]

ignore = [
    # FastAPI's dependency-injection idiom is a function call in an argument
    # default (Depends(...), Body(...)). That is the framework's documented
    # pattern, not a mutable-default bug.
    "B008",
]

[lint.per-file-ignores]
# Tests legitimately use assert and unused fixture arguments.
# ARG005: test doubles are often lambdas whose signature must
# match the callable they replace (e.g. dependency overrides),
# even when the body ignores some arguments.
# S107: dummy password defaults in SMTP/transport test doubles.
"**/tests/**" = ["S101", "ARG001", "ARG002", "ARG005", "S105", "S106", "S107"]
"tests/**" = ["S101", "ARG001", "ARG002", "ARG005", "S105", "S106", "S107"]

# Auth/DB/admin parameters on route handlers exist to trigger a FastAPI
# dependency (authorization check, session creation) even when the handler body
# does not read them. They are required by the framework, not dead parameters.
"backend/app/api/routes/**" = ["ARG001", "ARG002"]
# S105: these are cookie *names*, not credentials.
"backend/app/api/routes/auth.py" = ["S105"]
# gRPC server/client handlers keep parameters for interface symmetry.
"backend/app/grpc_clients/analysis_client.py" = ["ARG001", "ARG002"]
"services/**/server.py" = ["ARG001", "ARG002"]
# `host` binds 0.0.0.0 by design so the container is reachable outside its
# network namespace; local-only deployments override it.
"backend/app/config.py" = ["S104"]
"services/**/config.py" = ["S104"]
# `user_id` is part of the backtest service interface and is threaded through by
# callers; the current implementations run strategy-agnostic.
"backend/app/services/backtesting_service.py" = ["ARG001"]
# Live middleware/exception-handler callbacks required by Starlette's signature.
"backend/app/main.py" = ["ARG001"]
# Vestigial parameters kept for call-site compatibility. Tracked for cleanup:
#   - inverse_bot_monitor._execute_reversal: to_outcome / confidence / recommendation
#   - position_lifecycle_service._check_stale_positions: wallet_address
#   - stop_loss_monitor._check_user_price_orders: user_id
#   - copy_trade_service.calculate_trade_size: db
#   - leaderboard_service._fetch_from_polymarket_page: limit
#   - assessment_chain._research_market: description
"backend/app/services/inverse_bot_monitor.py" = ["ARG001"]
"backend/app/services/position_lifecycle_service.py" = ["ARG001"]
"backend/app/services/stop_loss_monitor.py" = ["ARG001"]
"backend/app/services/leaderboard_service.py" = ["ARG001"]
"backend/app/llm/assessment_chain.py" = ["ARG002"]
# Safety-cap helper takes a session for interface symmetry with its callers but
# reads caps from the already-loaded UserSettings row.
"backend/app/services/copy_trade_service.py" = ["ARG001"]
# S603: subprocess.run is called with a fixed argv list, shell=False, and only
# module-owned constants (sys.executable + alembic subcommand).
"backend/tests/test_migrations_security.py" = ["S603"]

[lint.isort]
known-first-party = ["app"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
docstring-code-format = false
