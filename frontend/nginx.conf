# ── Frontend nginx configuration (production) ─────────────────
# Serves the Vite SPA and reverse-proxies /api → backend:8002
# ───────────────────────────────────────────────────────────────

server {
    # Runs as the non-root 'nginx' user (uid 101), which cannot bind a
    # privileged (<1024) port without CAP_NET_BIND_SERVICE. 8080 avoids that.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "DENY"              always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection       "1; mode=block"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # HSTS (defense-in-depth). CSP is injected into the production index.html
    # by the Vite build (see vite.config.ts), so it is intentionally NOT set as
    # a header here to avoid conflicting enforcement of two policies.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Static assets (hashed filenames → long cache) ─────────
    # NOTE: `add_header` directives are NOT inherited from the server block
    # once any add_header is declared inside a location, so the security
    # headers must be repeated here (with `always`, including 4xx/5xx) or
    # /assets/ responses would be served without X-Frame-Options, nosniff,
    # Referrer-Policy and Permissions-Policy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # ── Real-time price stream (long-lived SSE) ─────────
    # Must come before the generic /api/ block: nginx picks
    # the most specific prefix match.
    location /api/portfolio/prices/stream {
        proxy_pass         http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE support
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        # The stream heartbeats every 15s; keep it open for hours.
        proxy_read_timeout 3600s;
    }

    # ── Reverse proxy: /api → backend ─────────────────────────
    location /api/ {
        proxy_pass         http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE support (analysis streaming)
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # ── Health endpoint (for backend /health) ─────────────────
    location /health {
        proxy_pass http://backend:8002;
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block dotfiles ────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
